<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Connect · Solis AI</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fdf9f5" />
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=15" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf9f5;
      --text: #18120e;
      --muted: #5c5048;
      --line: rgba(200, 185, 170, 0.4);
      --orange: #f05428;
      --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 500px at 50% -10%, rgba(255, 140, 90, 0.14), transparent 55%),
        radial-gradient(800px 400px at 90% 20%, rgba(255, 200, 140, 0.12), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .navbar-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 0px) 28px 0;
    }
    .navbar {
      width: 100%;
      max-width: 1180px;
      padding: 18px 0;
    }
    .navbar-grid {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 28px;
      min-height: 44px;
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
    }
    .nav-brand-icon { width: 28px; height: 28px; display: block; }
    .nav-logotype {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
    }
    .nav-beta {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--orange);
      background: rgba(240, 84, 40, 0.1);
      padding: 3px 7px;
      border-radius: 999px;
    }
    .nav-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .nav-menu a {
      font-size: 15px;
      font-weight: 500;
      color: #3d342c;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .nav-menu a:hover { color: var(--text); background: rgba(24, 18, 14, 0.04); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .nav-login {
      font-size: 15px;
      font-weight: 500;
      color: #3d342c;
      padding: 8px 12px;
    }
    .nav-login:hover { color: var(--text); }
    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 750;
      letter-spacing: -0.02em;
      background: linear-gradient(165deg, #ff8a5c 0%, #ff6b35 48%, #f05428 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.28) inset,
        0 6px 16px rgba(240, 84, 40, 0.28);
    }
    .nav-cta:hover { filter: brightness(1.04); }

    .stage {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 64px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px 28px 26px;
      box-shadow: 0 18px 50px rgba(40, 24, 12, 0.07);
      backdrop-filter: blur(10px);
    }

    .pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 26px;
    }
    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(24, 18, 14, 0.08);
      background: #fff;
      box-shadow: 0 8px 20px rgba(40, 24, 12, 0.08);
    }
    .app-icon svg, .app-icon img { width: 36px; height: 36px; display: block; }
    .app-icon--solis {
      background: linear-gradient(160deg, #fff7f2, #ffe8d8);
    }
    .app-icon--solis svg { width: 34px; height: 34px; }
    .app-icon--claude { background: #1a1512; }
    .app-icon--claude svg { width: 30px; height: 30px; }
    .app-icon--cursor { background: #14120b; padding: 0; }
    .app-icon--cursor svg { width: 100%; height: 100%; }
    .app-icon--chatgpt { background: #10a37f; }
    .app-icon--chatgpt svg { width: 30px; height: 30px; }
    .app-icon--generic { background: #18120e; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }

    .pair-link {
      width: 42px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(24,18,14,0.22), transparent);
      position: relative;
    }
    .pair-link::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 4px rgba(240, 84, 40, 0.15);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.65; }
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 8px;
    }
    .lede {
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 24px;
    }
    .lede .name { color: var(--text); font-weight: 700; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-family: var(--font-display);
      font-weight: 750;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-ok {
      color: #fff;
      background: linear-gradient(165deg, #ff8a5c 0%, #ff6b35 48%, #f05428 100%);
      box-shadow: 0 6px 16px rgba(240, 84, 40, 0.28);
    }
    .btn-ok:hover { filter: brightness(1.04); }
    .btn-cancel {
      background: rgba(24, 18, 14, 0.05);
      color: var(--text);
    }
    .btn-cancel:hover { background: rgba(24, 18, 14, 0.08); }
    .status {
      margin-top: 14px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status.err { color: #b91c1c; }

    @media (max-width: 760px) {
      .navbar-wrapper { padding-left: 16px; padding-right: 16px; }
      .nav-menu { display: none; }
      .navbar-grid { grid-template-columns: 1fr auto; gap: 12px; }
      .card { padding: 28px 22px 22px; }
    }
  </style>
</head>
<body>
  <div class="navbar-wrapper">
    <nav class="navbar" aria-label="Primary">
      <div class="navbar-grid">
        <a href="/" class="nav-brand" aria-label="Solis AI home">
          <svg class="nav-brand-icon" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="12" fill="#ea580c" />
            <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#ea580c" stroke-width="6" transform="rotate(45 50 50)" fill="none" />
            <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#ea580c" stroke-width="6" transform="rotate(-45 50 50)" fill="none" />
          </svg>
          <span class="nav-logotype">Solis AI</span>
          <span class="nav-beta">Beta</span>
        </a>
        <div class="nav-menu">
          <a href="/features">Features</a>
          <a href="/premium">Pricing</a>
          <a href="/faq">FAQ</a>
          <a href="/help">Help</a>
        </div>
        <div class="nav-actions">
          <a href="/?login=1" class="nav-login">Login</a>
          <a href="/dashboard" class="nav-cta"><span>Dashboard</span></a>
        </div>
      </div>
    </nav>
  </div>

  <main class="stage">
    <div class="card">
      <div class="pair" aria-hidden="true">
        <div class="app-icon" id="clientIcon"></div>
        <div class="pair-link"></div>
        <div class="app-icon app-icon--solis">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="12" fill="#ea580c" />
            <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#ea580c" stroke-width="6" transform="rotate(45 50 50)" fill="none" />
            <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#ea580c" stroke-width="6" transform="rotate(-45 50 50)" fill="none" />
          </svg>
        </div>
      </div>
      <h1>Connect to Solis AI</h1>
      <p class="lede" id="lede">Allow this app to use Solis on your account. Clip jobs will use your plan quota.</p>
      <div class="actions">
        <button type="button" class="btn btn-cancel" id="denyBtn">Deny</button>
        <button type="button" class="btn btn-ok" id="allowBtn">Allow</button>
      </div>
      <p class="status" id="status"></p>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get('client_id') || '';
      const redirectUri = params.get('redirect_uri') || '';
      const state = params.get('state') || '';
      const codeChallenge = params.get('code_challenge') || '';
      const codeChallengeMethod = params.get('code_challenge_method') || 'S256';
      const scope = params.get('scope') || 'solis';
      const responseType = params.get('response_type') || 'code';
      const resource = params.get('resource') || '';

      const apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'https://api.solisai.video'
        : 'https://api.solisai.video';

      const lede = document.getElementById('lede');
      const status = document.getElementById('status');
      const clientIcon = document.getElementById('clientIcon');

      const ICONS = {
        claude: {
          className: 'app-icon--claude',
          html: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#D97757" d="M12 2.2 13.7 8.4 20 9.2 15.4 13.4 16.9 19.7 12 16.6 7.1 19.7 8.6 13.4 4 9.2 10.3 8.4Z"/></svg>',
        },
        cursor: {
          className: 'app-icon--cursor',
          html: '<svg viewBox="600 300 400 400" xmlns="http://www.w3.org/2000/svg"><rect x="600" y="300" width="400" height="400" fill="#14120B"/><path fill="#EDECEC" d="M920.015 424.958L805.919 359.086C802.256 356.97 797.735 356.97 794.071 359.086L679.981 424.958C676.901 426.736 675 430.025 675 433.587V566.419C675 569.981 676.901 573.269 679.981 575.048L794.077 640.92C797.74 643.036 802.261 643.036 805.925 640.92L920.02 575.048C923.1 573.269 925.001 569.981 925.001 566.419V433.587C925.001 430.025 923.1 426.736 920.02 424.958H920.015ZM912.848 438.911L802.706 629.682C801.961 630.968 799.995 630.443 799.995 628.954V504.039C799.995 501.543 798.662 499.234 796.498 497.981L688.321 435.526C687.036 434.781 687.561 432.816 689.05 432.816H909.334C912.462 432.816 914.417 436.206 912.853 438.917H912.848V438.911Z"/></svg>',
        },
        chatgpt: {
          className: 'app-icon--chatgpt',
          html: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.3a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.373v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.844-3.373L15.119 7.21a.076.076 0 0 1 .071 0l4.83 2.787a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.674zm2.01-3.023-.141-.085-4.784-2.742a.776.776 0 0 0-.785 0L9.409 9.27V6.938a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135-2.02-1.164a.08.08 0 0 1-.038-.055V9.075a4.499 4.499 0 0 1 7.375-3.453l-.142.08-4.778 2.758a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>',
        },
      };

      function detectBrand(name) {
        const n = String(name || '').toLowerCase();
        if (n.includes('claude') || n.includes('anthropic')) return 'claude';
        if (n.includes('cursor')) return 'cursor';
        if (n.includes('chatgpt') || n.includes('openai') || n.includes('gpt')) return 'chatgpt';
        if ((redirectUri || '').includes('claude.ai')) return 'claude';
        if ((redirectUri || '').includes('chatgpt.com') || (redirectUri || '').includes('openai.com')) return 'chatgpt';
        return null;
      }

      function setClientIcon(name) {
        const brand = detectBrand(name);
        clientIcon.className = 'app-icon';
        if (brand && ICONS[brand]) {
          clientIcon.classList.add(ICONS[brand].className);
          clientIcon.innerHTML = ICONS[brand].html;
          return;
        }
        clientIcon.classList.add('app-icon--generic');
        const letter = (name || 'App').trim().charAt(0).toUpperCase() || 'A';
        clientIcon.textContent = letter;
      }

      function fail(msg) {
        status.classList.add('err');
        status.textContent = msg;
      }

      function bounce(url) {
        window.location.href = url;
      }

      function rememberReturnAndLogin() {
        try {
          sessionStorage.setItem('solis_mcp_oauth_return', window.location.href);
        } catch (_) {}
        try {
          document.cookie =
            'solis_mcp_oauth_return=' + encodeURIComponent(window.location.href) +
            '; Domain=.solisai.video; Path=/; Max-Age=900; Secure; SameSite=Lax';
        } catch (_) {}
        bounce('https://solisai.video/login.html?login=1');
      }

      async function loadClient() {
        setClientIcon('');
        if (!clientId) {
          fail('Missing client_id.');
          return;
        }
        try {
          const r = await fetch(apiBase + '/api/oauth/client/' + encodeURIComponent(clientId), {
            credentials: 'include',
          });
          if (r.ok) {
            const data = await r.json();
            const name = data.client_name || 'MCP client';
            setClientIcon(name);
            lede.innerHTML = 'Allow <span class="name">' + name.replace(/[<>&]/g, '') +
              '</span> to use Solis on your account. Clip jobs use your plan quota.';
          } else {
            setClientIcon(redirectUri);
          }
        } catch (_) {
          setClientIcon(redirectUri);
        }
      }

      document.getElementById('denyBtn').addEventListener('click', function () {
        if (!redirectUri) {
          fail('Missing redirect_uri.');
          return;
        }
        const u = new URL(redirectUri);
        u.searchParams.set('error', 'access_denied');
        u.searchParams.set('error_description', 'User denied access');
        if (state) u.searchParams.set('state', state);
        bounce(u.toString());
      });

      document.getElementById('allowBtn').addEventListener('click', async function () {
        status.classList.remove('err');
        status.textContent = 'Connecting…';
        if (!clientId || !redirectUri || !codeChallenge) {
          fail('Missing OAuth parameters.');
          return;
        }
        try {
          const check = await fetch(apiBase + '/api/auth/check', { credentials: 'include' });
          if (!check.ok) {
            rememberReturnAndLogin();
            return;
          }
          const body = {
            client_id: clientId,
            redirect_uri: redirectUri,
            state: state || undefined,
            code_challenge: codeChallenge,
            code_challenge_method: codeChallengeMethod,
            scope: scope,
            response_type: responseType,
            resource: resource || undefined,
          };
          const r = await fetch(apiBase + '/api/oauth/authorize', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await r.json().catch(function () { return {}; });
          if (!r.ok) {
            if (r.status === 401) {
              rememberReturnAndLogin();
              return;
            }
            fail(data.error_description || data.error || ('HTTP ' + r.status));
            return;
          }
          if (!data.redirect) {
            fail('No redirect from server.');
            return;
          }
          bounce(data.redirect);
        } catch (e) {
          fail(e.message || String(e));
        }
      });

      loadClient();
    })();
  </script>
</body>
</html>
