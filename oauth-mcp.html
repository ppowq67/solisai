<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Solis AI · MCP</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=15" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;background:#fdf9f5;color:#18120e;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:420px;background:#fff;border:1px solid rgba(200,185,170,0.4);border-radius:18px;padding:28px 26px 24px;box-shadow:0 12px 40px rgba(40,24,12,0.06)}
    .brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-0.03em;margin-bottom:18px}
    h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
    .lede{color:#5c5048;font-size:0.95rem;line-height:1.5;margin-bottom:22px}
    .name{font-weight:700;color:#18120e}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    button{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer}
    .ok{background:#18120e;color:#fff}
    .ok:hover{background:#2a211c}
    .cancel{background:rgba(0,0,0,0.05);color:#18120e}
    .cancel:hover{background:rgba(0,0,0,0.08)}
    .status{margin-top:14px;font-size:0.88rem;color:#5c5048;min-height:1.2em}
    .status.err{color:#b91c1c}
    a{color:#c2410c}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Solis AI</div>
    <h1>Connect an MCP client</h1>
    <p class="lede" id="lede">Allow this app to use Solis on your account. Clip jobs will use your plan quota.</p>
    <div class="actions">
      <button type="button" class="ok" id="allowBtn">Allow</button>
      <button type="button" class="cancel" id="denyBtn">Deny</button>
    </div>
    <p class="status" id="status"></p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get('client_id') || '';
      const redirectUri = params.get('redirect_uri') || '';
      const state = params.get('state') || '';
      const codeChallenge = params.get('code_challenge') || '';
      const codeChallengeMethod = params.get('code_challenge_method') || 'S256';
      const scope = params.get('scope') || 'solis';
      const responseType = params.get('response_type') || 'code';
      const resource = params.get('resource') || '';

      const apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'https://api.solisai.video'
        : 'https://api.solisai.video';

      const lede = document.getElementById('lede');
      const status = document.getElementById('status');

      function fail(msg) {
        status.classList.add('err');
        status.textContent = msg;
      }

      async function loadClient() {
        if (!clientId) {
          fail('Missing client_id.');
          return;
        }
        try {
          const r = await fetch(apiBase + '/api/oauth/client/' + encodeURIComponent(clientId), {
            credentials: 'include',
          });
          if (r.ok) {
            const data = await r.json();
            const name = data.client_name || 'MCP client';
            lede.innerHTML = 'Allow <span class="name">' + name.replace(/[<>&]/g, '') +
              '</span> to use Solis on your account. Clip jobs will use your plan quota.';
          }
        } catch (_) { /* keep default copy */ }
      }

      function bounce(url) {
        window.location.href = url;
      }

      function rememberReturnAndLogin() {
        try {
          sessionStorage.setItem('solis_mcp_oauth_return', window.location.href);
        } catch (_) {}
        try {
          document.cookie =
            'solis_mcp_oauth_return=' + encodeURIComponent(window.location.href) +
            '; Domain=.solisai.video; Path=/; Max-Age=900; Secure; SameSite=Lax';
        } catch (_) {}
        bounce('https://solisai.video/login.html?login=1');
      }

      document.getElementById('denyBtn').addEventListener('click', function () {
        if (!redirectUri) {
          fail('Missing redirect_uri.');
          return;
        }
        const u = new URL(redirectUri);
        u.searchParams.set('error', 'access_denied');
        u.searchParams.set('error_description', 'User denied access');
        if (state) u.searchParams.set('state', state);
        bounce(u.toString());
      });

      document.getElementById('allowBtn').addEventListener('click', async function () {
        status.classList.remove('err');
        status.textContent = 'Connecting…';
        if (!clientId || !redirectUri || !codeChallenge) {
          fail('Missing OAuth parameters.');
          return;
        }
        try {
          const check = await fetch(apiBase + '/api/auth/check', { credentials: 'include' });
          if (!check.ok) {
            rememberReturnAndLogin();
            return;
          }
          const body = {
            client_id: clientId,
            redirect_uri: redirectUri,
            state: state || undefined,
            code_challenge: codeChallenge,
            code_challenge_method: codeChallengeMethod,
            scope: scope,
            response_type: responseType,
            resource: resource || undefined,
          };
          const r = await fetch(apiBase + '/api/oauth/authorize', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await r.json().catch(function () { return {}; });
          if (!r.ok) {
            if (r.status === 401) {
              rememberReturnAndLogin();
              return;
            }
            fail(data.error_description || data.error || ('HTTP ' + r.status));
            return;
          }
          if (!data.redirect) {
            fail('No redirect from server.');
            return;
          }
          bounce(data.redirect);
        } catch (e) {
          fail(e.message || String(e));
        }
      });

      loadClient();
    })();
  </script>
</body>
</html>
